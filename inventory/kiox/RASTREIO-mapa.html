  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #topo { background:#0F1216; color:#fff; padding:10px 14px; font-size:15px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    #topo b { color:#4aa3ff; }
    #busca { margin-left:auto; background:#0d1117; color:#fff; border:1px solid #2e3d4d; border-radius:6px; padding:6px 10px; font-size:13px; width:180px; }
    #ranking { background:#3a2330; color:#ffd0d0; border:1px solid #5a2e3d; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px; font-weight:600; }
    #sair { background:#1c2530; color:#cfe3ff; border:1px solid #2e3d4d; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
    #mapa { width: 100%; height: calc(100% - 46px); }
    .info { font-size: 13px; line-height: 1.5; }
    .info a.gmaps { display:inline-block; background:#1f6feb; color:#fff; text-decoration:none; padding:6px 12px; border-radius:6px; font-size:13px; }
    /* Rótulo do nome sobre o pino (sem a "caixinha" padrão do tooltip) */
    .rotulo-kiox { background:transparent; border:0; box-shadow:none; padding:0;
      color:#0F1216; font-weight:700; font-size:12px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
    .rotulo-kiox::before { display:none; }
    /* Controles no mapa */
    .acoes-ctrl { display:flex; flex-direction:column; gap:6px; }
    .acoes-ctrl button { width:40px; height:40px; font-size:17px; background:#fff; border:2px solid rgba(0,0,0,.25); border-radius:8px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); line-height:1; }
    .acoes-ctrl button.ativo { background:#e53935; }
    .legenda-ctrl { background:rgba(22,27,34,.92); color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.7; box-shadow:0 1px 4px rgba(0,0,0,.4); }
    .legenda-ctrl i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; vertical-align:middle; border:2px solid #fff; }
    /* Tela de login */
    #login { position:fixed; inset:0; background:#0F1216; color:#fff; display:flex; align-items:center; justify-content:center; z-index:1000; }
    #login .box { background:#161b22; padding:28px 26px; border-radius:12px; width:300px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    #login h1 { margin:0 0 4px; font-size:20px; } #login h1 b { color:#4aa3ff; }
    #login p { margin:0 0 18px; font-size:13px; color:#9fb0c0; }
    #login input { width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px 12px; border-radius:7px; border:1px solid #2e3d4d; background:#0d1117; color:#fff; font-size:14px; }
    #login button { width:100%; padding:11px; border:0; border-radius:7px; background:#1f6feb; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    #login button:disabled { opacity:.6; cursor:default; }
    #erro { color:#ff6b6b; font-size:13px; min-height:18px; margin-top:8px; }
    /* Modal do ranking de desligados */
    #ranking-modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:1100; }
    #ranking-modal .box { background:#161b22; color:#fff; border-radius:12px; width:min(620px,92vw); max-height:82vh; overflow:auto; box-shadow:0 8px 30px rgba(0,0,0,.6); }
    #ranking-modal h2 { margin:0; padding:15px 18px; font-size:17px; border-bottom:1px solid #2e3d4d; display:flex; align-items:center; gap:10px; position:sticky; top:0; background:#161b22; }
    #ranking-modal table { width:100%; border-collapse:collapse; font-size:14px; }
    #ranking-modal th, #ranking-modal td { padding:9px 16px; text-align:left; border-bottom:1px solid #222c38; }
    #ranking-modal th { color:#9fb0c0; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
    #ranking-modal .fechar { margin-left:auto; background:#1c2530; color:#cfe3ff; border:1px solid #2e3d4d; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px; }
    #ranking-modal .vazio { padding:26px 20px; color:#7CFC98; text-align:center; font-size:15px; }
    #ranking-modal .tempo { color:#ff6b6b; font-weight:700; white-space:nowrap; }
    #ranking-modal .bat-baixa { color:#e53935; font-weight:700; }
  </style>
</head>
<body>
  <!-- Tela de login (e-mail/senha do admin) -->
  <div id="login">
    <form class="box" id="formLogin">
      <h1>KioX — <b>Rastreio mobile</b></h1>
      <p>Acesso restrito ao TI. Entre com o e-mail e a senha do administrador.</p>
      <input id="email" type="email" placeholder="e-mail do admin" autocomplete="username" required />
      <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required />
      <button id="btnEntrar" type="submit">Entrar</button>
      <div id="erro"></div>
    </form>
  </div>

  <div id="topo">KioX — Rastreio mobile &nbsp; <span id="status">conectando...</span> &nbsp;•&nbsp; <b id="qtd">0</b> aparelho(s)
    <input id="busca" type="text" placeholder="🔎 buscar aparelho..." />
    <button id="ranking" type="button">🔴 Ranking desligados</button>
    <button id="sair" type="button">Sair</button>
  </div>
  <div id="mapa"></div>

  <!-- Ranking de aparelhos desligados / sem sinal -->
  <div id="ranking-modal">
    <div class="box">
      <h2>🔴 Aparelhos desligados / sem sinal
        <button class="fechar" id="rankFechar" type="button">Fechar</button>
      </h2>
      <div id="rankConteudo"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // Configuração do projeto KioX-Frota (valores públicos do Firebase).
    const firebaseConfig = {
      apiKey: "AIzaSyBUpnlMlhIlcoz0DfBPadcgIMKXFXksqbo",
      authDomain: "kiox-frota.firebaseapp.com",
      databaseURL: "https://kiox-frota-default-rtdb.firebaseio.com",
      projectId: "kiox-frota"
    };
    firebase.initializeApp(firebaseConfig);

    const elLogin = document.getElementById('login');
    const elErro = document.getElementById('erro');
    const status = document.getElementById('status');
    const qtdEl = document.getElementById('qtd');
    const btnEntrar = document.getElementById('btnEntrar');

    let mapa = null;
    let clusterGroup = null;
    let jaEnquadrou = false;
    let enquadrarTimer = null;
    let circuloPrecisao = null;
    let filtroProblemas = false;
    const marcadores = {};
    const todos = {};              // id(uid) -> registro cru do banco (todos os nós)
    const ultimos = {};            // id -> registro MOSTRADO (após deduplica por androidId)
    const enderecos = {};          // id -> endereço (cache do geocoding)
    let escutando = false;
    let conectadoRTDB = false;     // conexão real com o servidor (não o login)

    // Minutos sem atualizar para considerar o aparelho COM PROBLEMA (pino vermelho).
    const LIMITE_MIN = 90;

    function fmtHora(ms) {
      if (!ms) return '—';
      try { return new Date(ms).toLocaleString('pt-BR'); } catch (e) { return String(ms); }
    }
    function fmtHaQuanto(ms) {
      if (!ms) return 'nunca';
      const min = Math.floor((Date.now() - ms) / 60000);
      if (min < 1) return 'agora';
      if (min < 60) return 'há ' + min + ' min';
      const h = Math.floor(min / 60);
      if (h < 24) return 'há ' + h + ' h';
      return 'há ' + Math.floor(h / 24) + ' d';
    }
    function estaOffline(d) {
      return !d.hora || (Date.now() - d.hora) > LIMITE_MIN * 60000;
    }
    function nomeDe(d, id) {
      return (d.nome && d.nome.trim()) ? d.nome.trim() : (d.modelo || id);
    }

    // Ícone do pino: um CELULAR colorido (azul = ok, vermelho = sem sinal).
    function iconePino(offline) {
      const cor = offline ? '#e53935' : '#1f6feb';
      const svg =
        '<svg width="28" height="28" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))">' +
        '<rect x="5" y="1.5" width="14" height="21" rx="3" fill="' + cor + '" stroke="#fff" stroke-width="1.6"/>' +
        '<line x1="10" y1="4" x2="14" y2="4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>' +
        '<circle cx="12" cy="19.5" r="1.15" fill="#fff"/></svg>';
      return L.divIcon({ className: '', html: svg, iconSize: [28, 28], iconAnchor: [14, 14] });
    }
    // Ícone do AGRUPAMENTO: nº de aparelhos; vermelho se algum estiver sem sinal.
    function iconeCluster(cluster) {
      const filhos = cluster.getAllChildMarkers();
      const cor = filhos.some((m) => m.options.offline) ? '#e53935' : '#1f6feb';
      return L.divIcon({
        className: '',
        html: '<div style="width:38px;height:38px;border-radius:50%;background:' + cor +
              ';border:3px solid #fff;box-shadow:0 0 5px rgba(0,0,0,.5);display:flex;' +
              'align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px">' +
              filhos.length + '</div>',
        iconSize: [44, 44]
      });
    }

    // Login e-mail/senha — só o admin (criado no console) consegue ler a frota.
    document.getElementById('formLogin').addEventListener('submit', (ev) => {
      ev.preventDefault();
      elErro.textContent = '';
      btnEntrar.disabled = true;
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      firebase.auth().signInWithEmailAndPassword(email, senha)
        .catch((e) => { elErro.textContent = 'Falha no login: ' + e.message; })
        .finally(() => { btnEntrar.disabled = false; });
    });
    document.getElementById('sair').addEventListener('click', () => firebase.auth().signOut());

    // Busca por nome/modelo: centraliza e abre o popup do aparelho encontrado.
    document.getElementById('busca').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter') return;
      const q = ev.target.value.trim().toLowerCase();
      if (!q) return;
      const id = Object.keys(ultimos).find((id) => {
        const d = ultimos[id];
        return nomeDe(d, id).toLowerCase().includes(q) || (d.modelo || '').toLowerCase().includes(q);
      });
      if (id && marcadores[id]) {
        clusterGroup.zoomToShowLayer(marcadores[id], () => marcadores[id].openPopup());
      } else {
        alert('Aparelho não encontrado: ' + ev.target.value);
      }
    });

    // Ranking de desligados.
    document.getElementById('ranking').addEventListener('click', abrirRanking);
    document.getElementById('rankFechar').addEventListener('click', () => {
      document.getElementById('ranking-modal').style.display = 'none';
    });
    document.getElementById('ranking-modal').addEventListener('click', (ev) => {
      if (ev.target.id === 'ranking-modal') ev.target.style.display = 'none';
    });
    function abrirRanking() {
      const lista = Object.keys(ultimos).map((id) => ({ id: id, d: ultimos[id], desde: ultimos[id].hora || 0 }))
        .filter((x) => estaOffline(x.d)).sort((a, b) => a.desde - b.desde);
      const cont = document.getElementById('rankConteudo');
      if (!lista.length) {
        cont.innerHTML = '<div class="vazio">✓ Nenhum aparelho desligado — todos enviando sinal.</div>';
      } else {
        let html = '<table><thead><tr><th>#</th><th>Aparelho</th><th>Desligado há</th><th>Bateria</th><th>Última vez</th></tr></thead><tbody>';
        lista.forEach((x, i) => {
          const bat = (x.d.bateria == null) ? '?' : (x.d.bateria + '%');
          const batCls = (x.d.bateria != null && x.d.bateria <= 20) ? ' class="bat-baixa"' : '';
          html += '<tr><td>' + (i + 1) + '</td>' +
            '<td><b>' + nomeDe(x.d, x.id) + '</b><br><span style="color:#9fb0c0;font-size:12px">' + (x.d.modelo || '') + '</span></td>' +
            '<td class="tempo">' + fmtHaQuanto(x.desde).replace('há ', '') + '</td>' +
            '<td' + batCls + '>' + bat + '</td>' +
            '<td>' + fmtHora(x.desde) + '</td></tr>';
        });
        cont.innerHTML = html + '</tbody></table>';
      }
      document.getElementById('ranking-modal').style.display = 'flex';
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user && user.isAnonymous) { firebase.auth().signOut(); return; }
      if (user) { elLogin.style.display = 'none'; iniciarMapa(); }
      else { elLogin.style.display = 'flex'; status.textContent = 'desconectado'; }
    });

    function iniciarMapa() {
      if (!mapa) {
        mapa = L.map('mapa').setView([-21.255, -48.322], 12); // Jaboticabal-SP
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(mapa);
        clusterGroup = L.markerClusterGroup({
          iconCreateFunction: iconeCluster, maxClusterRadius: 45,
          showCoverageOnHover: false, spiderfyOnMaxZoom: true
        });
        mapa.addLayer(clusterGroup);
        mapa.on('zoomend moveend', declutter);
        clusterGroup.on('animationend', declutter);

        // Botões de ação (centralizar, filtro só-problemas, exportar CSV).
        const acoes = L.control({ position: 'topright' });
        acoes.onAdd = function () {
          const div = L.DomUtil.create('div', 'acoes-ctrl');
          div.innerHTML =
            '<button id="btnCentralizar" title="Centralizar na frota">🎯</button>' +
            '<button id="btnFiltro" title="Mostrar só aparelhos com problema">🔴</button>' +
            '<button id="btnCsv" title="Exportar planilha (CSV)">⬇️</button>';
          L.DomEvent.disableClickPropagation(div);
          return div;
        };
        acoes.addTo(mapa);
        // Legenda.
        const legenda = L.control({ position: 'bottomright' });
        legenda.onAdd = function () {
          const div = L.DomUtil.create('div', 'legenda-ctrl');
          div.innerHTML = '<div><i style="background:#1f6feb"></i>OK (enviando)</div>' +
                          '<div><i style="background:#e53935"></i>sem sinal +' + LIMITE_MIN + 'min</div>';
          return div;
        };
        legenda.addTo(mapa);

        document.getElementById('btnCentralizar').addEventListener('click', centralizarFrota);
        document.getElementById('btnCsv').addEventListener('click', exportarCsv);
        document.getElementById('btnFiltro').addEventListener('click', function () {
          filtroProblemas = !filtroProblemas;
          this.classList.toggle('ativo', filtroProblemas);
          aplicarFiltro();
        });
      }
      if (!mapa._pintarTimer) mapa._pintarTimer = setInterval(pintar, 30000);
      if (escutando) return;
      escutando = true;
      status.textContent = 'conectado';
      // Estado REAL da conexão com o servidor (não do login). Sem isto, uma queda
      // momentânea do WebSocket do Firebase faz o mapa "piscar" para 0 aparelhos.
      firebase.database().ref('.info/connected').on('value', (s) => {
        conectadoRTDB = (s.val() === true);
        if (!conectadoRTDB) {
          status.innerHTML = '<span style="color:#ffb84a">reconectando ao servidor…</span>';
        }
      });
      const refDevices = firebase.database().ref('devices');
      const onErroLeitura = (err) => { status.textContent = 'sem permissão de leitura: ' + err.message; };
      // Listeners POR FILHO: o Firebase envia só o registro que MUDA (~1 KB), em vez do
      // nó inteiro (~50 KB) a cada atualização de qualquer aparelho. Economiza muito
      // download com a frota grande (evita estourar a cota do plano free).
      refDevices.on('child_added', (s) => { todos[s.key] = s.val(); recalcular(); }, onErroLeitura);
      refDevices.on('child_changed', (s) => { todos[s.key] = s.val(); recalcular(); }, onErroLeitura);
      refDevices.on('child_removed', (s) => { delete todos[s.key]; recalcular(); });
    }

    // Reconstrói os marcadores a partir de `todos` (todos os registros do banco),
    // deduplicando por androidId: só o registro MAIS RECENTE de cada aparelho físico.
    // Roda localmente a cada evento — não gera download (o dado já veio no evento).
    function recalcular() {
      const melhorPorAndroid = {};
      const idsMostrar = [];
      Object.keys(todos).forEach((id) => {
        const d = todos[id];
        if (!d || typeof d.lat !== 'number' || typeof d.lon !== 'number') return;
        const aid = d.androidId;
        if (!aid) { idsMostrar.push(id); return; }
        const ant = melhorPorAndroid[aid];
        if (ant == null || (d.hora || 0) > (todos[ant].hora || 0)) melhorPorAndroid[aid] = id;
      });
      Object.keys(melhorPorAndroid).forEach((aid) => idsMostrar.push(melhorPorAndroid[aid]));
      const vistos = new Set();
      let bounds = [];
      idsMostrar.forEach((id) => {
        const d = todos[id];
        vistos.add(id);
        ultimos[id] = d;
        const nome = nomeDe(d, id);
        if (marcadores[id]) {
          const m = marcadores[id];
          const ll = m.getLatLng();
          if (ll.lat !== d.lat || ll.lng !== d.lon) {
            enderecos[id] = null;   // mudou de lugar: re-busca o endereço
            clusterGroup.removeLayer(m);
            m.setLatLng([d.lat, d.lon]);
            clusterGroup.addLayer(m);
          }
          m.setTooltipContent(nome);
        } else {
          const m = L.marker([d.lat, d.lon], { icon: iconePino(false) })
            .bindPopup('', { maxWidth: 300 })
            .bindTooltip(nome, { permanent: true, direction: 'top', offset: [0, -16], className: 'rotulo-kiox' });
          m.options.offline = false;
          m.on('popupopen', () => onPopupOpen(id));
          m.on('popupclose', onPopupClose);
          marcadores[id] = m;
          clusterGroup.addLayer(m);
        }
        bounds.push([d.lat, d.lon]);
      });
      Object.keys(marcadores).forEach((id) => {
        if (!vistos.has(id)) {
          clusterGroup.removeLayer(marcadores[id]);
          delete marcadores[id]; delete ultimos[id]; delete enderecos[id];
        }
      });
      pintar();
      // Enquadra a frota só na 1ª carga, com debounce: espera os child_added iniciais
      // pararem de chegar (~600ms) para enquadrar TODOS, não só o primeiro.
      if (!jaEnquadrou && bounds.length) {
        clearTimeout(enquadrarTimer);
        enquadrarTimer = setTimeout(() => {
          const pts = Object.keys(marcadores).map((id) => marcadores[id].getLatLng());
          if (pts.length) { mapa.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 16 }); jaEnquadrou = true; }
        }, 600);
      }
    }

    // Monta o conteúdo do popup de um aparelho (usa o endereço em cache, se houver).
    function popupHtml(id) {
      const d = ultimos[id]; if (!d) return '';
      const offline = estaOffline(d);
      const aviso = offline ? '<br><b style="color:#e53935">⚠ SEM SINAL ' + fmtHaQuanto(d.hora) + '</b>' : '';
      const bat = (d.bateria == null) ? '?' : (d.bateria + '%');
      const batStyle = (d.bateria != null && d.bateria <= 20) ? 'color:#e53935;font-weight:700' : '';
      const gmaps = 'https://www.google.com/maps?q=' + d.lat + ',' + d.lon;
      // Botão remover SEMPRE (azul ou vermelho) — útil p/ limpar duplicatas. Aviso:
      // se o aparelho ainda estiver ativo, ele reaparece no próximo envio.
      const btnRemover = '<button onclick="removerDevice(\'' + id + '\')" style="background:#e53935;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px">Remover do mapa</button>';
      return '<div class="info"><b>' + nomeDe(d, id) + '</b>' + aviso + '<br>' +
        'Modelo: ' + (d.modelo || '?') + '<br>' +
        '🔋 Bateria: <span style="' + batStyle + '">' + bat + '</span><br>' +
        'Precisão: ' + (d.precisao_m ? Math.round(d.precisao_m) + ' m' : '?') + '<br>' +
        'Versão: ' + (d.versao || '?') + '<br>' +
        'Atualizado: ' + fmtHora(d.hora) + ' (' + fmtHaQuanto(d.hora) + ')<br>' +
        'ID: <code style="font-size:11px;color:#9fb0c0">' + id.slice(0, 14) + '…</code><br>' +
        '📍 ' + (enderecos[id] || '<i>buscando endereço…</i>') +
        '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' +
        '<a class="gmaps" href="' + gmaps + '" target="_blank" rel="noopener">Abrir no Google Maps</a>' +
        btnRemover + '</div></div>';
    }

    // Geocoding reverso (OpenStreetMap/Nominatim) — só sob demanda, ao abrir o popup.
    function buscarEndereco(id) {
      const d = ultimos[id]; if (!d || enderecos[id]) return;
      enderecos[id] = '<i>buscando endereço…</i>';
      fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + d.lat + '&lon=' + d.lon,
            { headers: { 'Accept-Language': 'pt-BR' } })
        .then((r) => r.json())
        .then((j) => {
          const a = j.address || {};
          const rua = a.road || a.pedestrian || a.cycleway || '';
          const num = a.house_number ? ', ' + a.house_number : '';
          const bairro = a.suburb || a.neighbourhood || a.quarter || '';
          const cidade = a.city || a.town || a.village || a.municipality || '';
          const uf = a.state || '';
          const partes = [(rua ? rua + num : ''), bairro, cidade, uf].filter(Boolean);
          enderecos[id] = partes.length ? partes.join(' · ')
            : (j.display_name || 'endereço indisponível');
          if (marcadores[id] && marcadores[id].isPopupOpen()) marcadores[id].setPopupContent(popupHtml(id));
        })
        .catch(() => {
          enderecos[id] = 'endereço indisponível';
          if (marcadores[id] && marcadores[id].isPopupOpen()) marcadores[id].setPopupContent(popupHtml(id));
        });
    }

    function onPopupOpen(id) {
      const d = ultimos[id]; if (!d) return;
      marcadores[id].setPopupContent(popupHtml(id));
      buscarEndereco(id);
      if (circuloPrecisao) { mapa.removeLayer(circuloPrecisao); circuloPrecisao = null; }
      if (d.precisao_m) {
        circuloPrecisao = L.circle([d.lat, d.lon], {
          radius: d.precisao_m, color: '#1f6feb', weight: 1, fillColor: '#1f6feb', fillOpacity: 0.1
        }).addTo(mapa);
      }
    }
    function onPopupClose() {
      if (circuloPrecisao) { mapa.removeLayer(circuloPrecisao); circuloPrecisao = null; }
    }

    // Recolore pinos/clusters pelo tempo sem sinal e reescreve os popups.
    function pintar() {
      let problemas = 0, total = 0;
      Object.keys(marcadores).forEach((id) => {
        const d = ultimos[id]; if (!d) return;
        total++;
        const offline = estaOffline(d);
        if (offline) problemas++;
        const m = marcadores[id];
        if (m.options.offline !== offline) { m.options.offline = offline; m.setIcon(iconePino(offline)); }
        m.setPopupContent(popupHtml(id));
      });
      if (clusterGroup) clusterGroup.refreshClusters();
      aplicarFiltro();
      qtdEl.textContent = total;
      if (total > 0) {
        status.innerHTML = problemas > 0
          ? '<span style="color:#ff6b6b">⚠ ' + problemas + ' com problema</span>'
          : '<span style="color:#7CFC98">todos ok</span>';
      }
      setTimeout(declutter, 0);
    }

    // Esconde nomes que se sobreporiam, priorizando os SEM sinal.
    function declutter() {
      if (!mapa || !clusterGroup) return;
      const ocupados = [];
      const ids = Object.keys(marcadores).sort((a, b) =>
        (marcadores[b].options.offline ? 1 : 0) - (marcadores[a].options.offline ? 1 : 0));
      ids.forEach((id) => {
        const m = marcadores[id];
        const tt = m.getTooltip();
        const el = tt && tt.getElement();
        if (!el) return;
        if (clusterGroup.getVisibleParent(m) !== m) return;
        const p = mapa.latLngToContainerPoint(m.getLatLng());
        const w = el.offsetWidth || 60, h = el.offsetHeight || 16;
        const r = { x: p.x - w / 2, y: p.y - 26 - h, w: w, h: h };
        const colide = ocupados.some((o) => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
        if (colide) { el.style.display = 'none'; }
        else { el.style.display = ''; ocupados.push(r); }
      });
    }

    // Filtro "só com problema": mantém no mapa só os aparelhos sem sinal.
    function aplicarFiltro() {
      if (!clusterGroup) return;
      Object.keys(marcadores).forEach((id) => {
        const m = marcadores[id];
        const mostrar = !filtroProblemas || m.options.offline;
        const tem = clusterGroup.hasLayer(m);
        if (mostrar && !tem) clusterGroup.addLayer(m);
        else if (!mostrar && tem) clusterGroup.removeLayer(m);
      });
    }

    function centralizarFrota() {
      const pts = [];
      Object.keys(marcadores).forEach((id) => { if (clusterGroup.hasLayer(marcadores[id])) pts.push(marcadores[id].getLatLng()); });
      if (pts.length) mapa.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 16 });
    }

    // Exporta a frota atual em CSV (abre no Excel).
    function exportarCsv() {
      const linhas = [['Nome', 'Modelo', 'Status', 'Bateria_%', 'Latitude', 'Longitude', 'Precisao_m', 'Versao', 'Ultima_atualizacao']];
      Object.keys(ultimos).forEach((id) => {
        const d = ultimos[id];
        linhas.push([
          nomeDe(d, id), d.modelo || '', estaOffline(d) ? 'SEM SINAL' : 'OK',
          (d.bateria == null ? '' : d.bateria), d.lat, d.lon,
          (d.precisao_m ? Math.round(d.precisao_m) : ''), d.versao || '',
          d.hora ? new Date(d.hora).toLocaleString('pt-BR') : ''
        ]);
      });
      const csv = linhas.map((l) => l.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'frota-kiox.csv';
      document.body.appendChild(a); a.click(); a.remove();
    }

    // Remove um aparelho "fantasma" do banco (formatado/desativado). Só o admin.
    function removerDevice(id) {
      const d = ultimos[id] || {};
      if (!confirm('Remover "' + nomeDe(d, id) + '" do mapa?\n\nIsso apaga o registro no banco. Se o aparelho voltar a enviar, ele reaparece.')) return;
      firebase.database().ref('devices/' + id).remove()
        .then(() => { if (marcadores[id]) marcadores[id].closePopup(); })
        .catch((e) => alert('Falha ao remover: ' + e.message));
    }
  </script>
</body>
</html>
