<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KioX - Frota (mapa)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #topo { background:#0F1216; color:#fff; padding:10px 14px; font-size:15px; display:flex; align-items:center; gap:10px; }
    #topo b { color:#4aa3ff; }
    #sair { margin-left:auto; background:#1c2530; color:#cfe3ff; border:1px solid #2e3d4d; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
    #mapa { width: 100%; height: calc(100% - 44px); }
    .info { font-size: 13px; line-height: 1.5; }
    /* Rótulo do nome sobre o pino (sem a "caixinha" padrão do tooltip) */
    .rotulo-kiox { background:transparent; border:0; box-shadow:none; padding:0;
      color:#0F1216; font-weight:700; font-size:12px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
    .rotulo-kiox::before { display:none; }
    /* Tela de login */
    #login { position:fixed; inset:0; background:#0F1216; color:#fff; display:flex; align-items:center; justify-content:center; z-index:1000; }
    #login .box { background:#161b22; padding:28px 26px; border-radius:12px; width:300px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    #login h1 { margin:0 0 4px; font-size:20px; } #login h1 b { color:#4aa3ff; }
    #login p { margin:0 0 18px; font-size:13px; color:#9fb0c0; }
    #login input { width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px 12px; border-radius:7px; border:1px solid #2e3d4d; background:#0d1117; color:#fff; font-size:14px; }
    #login button { width:100%; padding:11px; border:0; border-radius:7px; background:#1f6feb; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    #login button:disabled { opacity:.6; cursor:default; }
    #erro { color:#ff6b6b; font-size:13px; min-height:18px; margin-top:8px; }
  </style>
</head>
<body>
  <!-- Tela de login (e-mail/senha do admin) -->
  <div id="login">
    <form class="box" id="formLogin">
      <h1>KioX — <b>Frota</b></h1>
      <p>Acesso restrito ao TI. Entre com o e-mail e a senha do administrador.</p>
      <input id="email" type="email" placeholder="e-mail do admin" autocomplete="username" required />
      <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required />
      <button id="btnEntrar" type="submit">Entrar</button>
      <div id="erro"></div>
    </form>
  </div>

  <div id="topo">KioX — Frota &nbsp; <span id="status">conectando...</span> &nbsp;•&nbsp; <b id="qtd">0</b> aparelho(s)
    <button id="sair" type="button">Sair</button>
  </div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // Configuração do projeto KioX-Frota (valores públicos do Firebase).
    const firebaseConfig = {
      apiKey: "AIzaSyBUpnlMlhIlcoz0DfBPadcgIMKXFXksqbo",
      authDomain: "kiox-frota.firebaseapp.com",
      databaseURL: "https://kiox-frota-default-rtdb.firebaseio.com",
      projectId: "kiox-frota"
    };
    firebase.initializeApp(firebaseConfig);

    const elLogin = document.getElementById('login');
    const elErro = document.getElementById('erro');
    const status = document.getElementById('status');
    const qtdEl = document.getElementById('qtd');
    const btnEntrar = document.getElementById('btnEntrar');

    let mapa = null;
    let clusterGroup = null;
    let jaEnquadrou = false;
    const marcadores = {};
    const ultimos = {};            // id -> último registro recebido
    let escutando = false;

    // Minutos sem atualizar para considerar o aparelho COM PROBLEMA (pino vermelho).
    // O app envia a cada 30 min; 90 min = ~3 ciclos perdidos, evita falso alarme.
    const LIMITE_MIN = 90;

    function fmtHora(ms) {
      if (!ms) return '—';
      try { return new Date(ms).toLocaleString('pt-BR'); } catch (e) { return String(ms); }
    }

    function fmtHaQuanto(ms) {
      if (!ms) return 'nunca';
      const min = Math.floor((Date.now() - ms) / 60000);
      if (min < 1) return 'agora';
      if (min < 60) return 'há ' + min + ' min';
      const h = Math.floor(min / 60);
      if (h < 24) return 'há ' + h + ' h';
      return 'há ' + Math.floor(h / 24) + ' d';
    }

    // Ícone do pino: um CELULAR colorido (azul = ok, vermelho = sem sinal),
    // desenhado em SVG inline (sem depender de imagem externa).
    function iconePino(offline) {
      const cor = offline ? '#e53935' : '#1f6feb';
      const svg =
        '<svg width="28" height="28" viewBox="0 0 24 24" ' +
        'style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))">' +
        '<rect x="5" y="1.5" width="14" height="21" rx="3" fill="' + cor + '" stroke="#fff" stroke-width="1.6"/>' +
        '<line x1="10" y1="4" x2="14" y2="4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>' +
        '<circle cx="12" cy="19.5" r="1.15" fill="#fff"/>' +
        '</svg>';
      return L.divIcon({
        className: '',
        html: svg,
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
    }

    // Ícone do AGRUPAMENTO: nº de aparelhos; vermelho se algum estiver sem sinal.
    function iconeCluster(cluster) {
      const filhos = cluster.getAllChildMarkers();
      const cor = filhos.some((m) => m.options.offline) ? '#e53935' : '#1f6feb';
      return L.divIcon({
        className: '',
        html: '<div style="width:38px;height:38px;border-radius:50%;background:' + cor +
              ';border:3px solid #fff;box-shadow:0 0 5px rgba(0,0,0,.5);display:flex;' +
              'align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px">' +
              filhos.length + '</div>',
        iconSize: [44, 44]
      });
    }

    // Login e-mail/senha — só o admin (criado no console) consegue ler a frota.
    document.getElementById('formLogin').addEventListener('submit', (ev) => {
      ev.preventDefault();
      elErro.textContent = '';
      btnEntrar.disabled = true;
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      firebase.auth().signInWithEmailAndPassword(email, senha)
        .catch((e) => { elErro.textContent = 'Falha no login: ' + e.message; })
        .finally(() => { btnEntrar.disabled = false; });
    });

    document.getElementById('sair').addEventListener('click', () => firebase.auth().signOut());

    firebase.auth().onAuthStateChanged((user) => {
      // So aceita login real (e-mail/senha do admin). Uma sessao ANONIMA antiga
      // (de versoes anteriores do mapa) fica salva no navegador e nao tem mais
      // permissao de leitura — descarta para nao "pular" o login mostrando 0.
      if (user && user.isAnonymous) { firebase.auth().signOut(); return; }
      if (user) {
        elLogin.style.display = 'none';
        iniciarMapa();
      } else {
        elLogin.style.display = 'flex';
        status.textContent = 'desconectado';
      }
    });

    function iniciarMapa() {
      if (!mapa) {
        mapa = L.map('mapa').setView([-21.255, -48.322], 12); // Jaboticabal-SP
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(mapa);
        // Agrupa aparelhos próximos; separa ao dar zoom / clicar (spiderfy no zoom máx).
        clusterGroup = L.markerClusterGroup({
          iconCreateFunction: iconeCluster,
          maxClusterRadius: 45,
          showCoverageOnHover: false,
          spiderfyOnMaxZoom: true
        });
        mapa.addLayer(clusterGroup);
        // Ao mover/dar zoom e ao (des)agrupar, reavalia quais nomes cabem sem sobrepor.
        mapa.on('zoomend moveend', declutter);
        clusterGroup.on('animationend', declutter);
      }
      if (!mapa._pintarTimer) {
        mapa._pintarTimer = setInterval(pintar, 30000); // reavalia cores com o tempo
      }
      if (escutando) return;
      escutando = true;
      status.textContent = 'conectado';
      firebase.database().ref('devices').on('value', (snap) => {
        const dados = snap.val() || {};
        const vistos = new Set();
        let bounds = [];
        Object.keys(dados).forEach((id) => {
          const d = dados[id];
          if (typeof d.lat !== 'number' || typeof d.lon !== 'number') return;
          vistos.add(id);
          ultimos[id] = d;
          const nome = (d.nome && d.nome.trim()) ? d.nome.trim() : (d.modelo || id);
          if (marcadores[id]) {
            const m = marcadores[id];
            const ll = m.getLatLng();
            if (ll.lat !== d.lat || ll.lng !== d.lon) {
              // Posição mudou: reposiciona no cluster certo.
              clusterGroup.removeLayer(m);
              m.setLatLng([d.lat, d.lon]);
              clusterGroup.addLayer(m);
            }
            m.setTooltipContent(nome);
          } else {
            marcadores[id] = L.marker([d.lat, d.lon], { icon: iconePino(false) })
              .bindPopup('', { maxWidth: 280 })
              .bindTooltip(nome, { permanent: true, direction: 'top', offset: [0, -16], className: 'rotulo-kiox' });
            marcadores[id].options.offline = false;
            clusterGroup.addLayer(marcadores[id]);
          }
          bounds.push([d.lat, d.lon]);
        });
        // remove aparelhos que sumiram do banco
        Object.keys(marcadores).forEach((id) => {
          if (!vistos.has(id)) {
            clusterGroup.removeLayer(marcadores[id]);
            delete marcadores[id]; delete ultimos[id];
          }
        });
        pintar();
        // Enquadra a frota só na 1ª carga (não fica "pulando" a cada atualização).
        if (!jaEnquadrou && bounds.length) {
          mapa.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
          jaEnquadrou = true;
        }
      }, (err) => { status.textContent = 'sem permissão de leitura: ' + err.message; });
    }

    // Recolore pinos e clusters pelo tempo desde a última atualização (azul = ok,
    // vermelho = sem sinal) e reescreve os popups. Roda no evento e a cada 30s.
    function pintar() {
      const limiteMs = LIMITE_MIN * 60000;
      let problemas = 0, total = 0;
      Object.keys(marcadores).forEach((id) => {
        const d = ultimos[id]; if (!d) return;
        total++;
        const offline = !d.hora || (Date.now() - d.hora) > limiteMs;
        if (offline) problemas++;
        const m = marcadores[id];
        if (m.options.offline !== offline) {
          m.options.offline = offline;
          m.setIcon(iconePino(offline));
        }
        const nome = (d.nome && d.nome.trim()) ? d.nome.trim() : (d.modelo || id);
        const aviso = offline
          ? '<br><b style="color:#e53935">⚠ SEM SINAL ' + fmtHaQuanto(d.hora) + '</b>'
          : '';
        // Botão de remover só nos aparelhos sem sinal (fantasmas: formatados/desativados).
        const btnRemover = offline
          ? '<br><button onclick="removerDevice(\'' + id + '\')" ' +
            'style="margin-top:8px;padding:6px 12px;border:0;border-radius:6px;' +
            'background:#e53935;color:#fff;cursor:pointer;font-size:13px">Remover do mapa</button>'
          : '';
        m.setPopupContent(
          '<div class="info"><b>' + nome + '</b>' + aviso + '<br>' +
          'Modelo: ' + (d.modelo || '?') + '<br>' +
          'Bateria: ' + (d.bateria ?? '?') + '%<br>' +
          'Precisão: ' + (d.precisao_m ? Math.round(d.precisao_m) + ' m' : '?') + '<br>' +
          'Versão: ' + (d.versao || '?') + '<br>' +
          'Atualizado: ' + fmtHora(d.hora) + ' (' + fmtHaQuanto(d.hora) + ')' +
          btnRemover + '</div>'
        );
      });
      if (clusterGroup) clusterGroup.refreshClusters();
      qtdEl.textContent = total;
      if (total > 0) {
        status.innerHTML = problemas > 0
          ? '<span style="color:#ff6b6b">⚠ ' + problemas + ' com problema</span>'
          : '<span style="color:#7CFC98">todos ok</span>';
      }
      setTimeout(declutter, 0);
    }

    // Esconde os nomes (rótulos) que se sobreporiam, priorizando os SEM sinal. Ao dar
    // zoom os pontos se afastam e mais nomes reaparecem. Não altera os pinos, só a
    // visibilidade dos rótulos. Roda a cada zoom/move/(des)agrupamento/atualização.
    function declutter() {
      if (!mapa || !clusterGroup) return;
      const ocupados = [];
      // Sem sinal primeiro: o rótulo do aparelho problemático tem prioridade.
      const ids = Object.keys(marcadores).sort((a, b) =>
        (marcadores[b].options.offline ? 1 : 0) - (marcadores[a].options.offline ? 1 : 0));
      ids.forEach((id) => {
        const m = marcadores[id];
        const tt = m.getTooltip();
        const el = tt && tt.getElement();
        if (!el) return;
        if (clusterGroup.getVisibleParent(m) !== m) return; // agrupado: o cluster o representa
        const p = mapa.latLngToContainerPoint(m.getLatLng());
        const w = el.offsetWidth || 60, h = el.offsetHeight || 16;
        const r = { x: p.x - w / 2, y: p.y - 26 - h, w: w, h: h };
        const colide = ocupados.some((o) =>
          r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
        if (colide) { el.style.display = 'none'; }
        else { el.style.display = ''; ocupados.push(r); }
      });
    }

    // Remove um aparelho "fantasma" do banco (ex.: formatado/desativado). Só o admin
    // tem permissão (ver regras). O listener on('value') tira o pino sozinho depois.
    function removerDevice(id) {
      const d = ultimos[id] || {};
      const nome = (d.nome && d.nome.trim()) ? d.nome.trim() : (d.modelo || id);
      if (!confirm('Remover "' + nome + '" do mapa?\n\nIsso apaga o registro no banco. Se o aparelho voltar a enviar, ele reaparece.')) return;
      firebase.database().ref('devices/' + id).remove()
        .then(() => { if (marcadores[id]) { marcadores[id].closePopup(); } })
        .catch((e) => alert('Falha ao remover: ' + e.message));
    }
  </script>
</body>
</html>
