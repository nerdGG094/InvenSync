{% extends "base.html" %}
{% block title %}Verificação em duas etapas{% endblock %}

{% block extra_head %}
{# Mesma folha da tela de login — antes este arquivo repetia o bloco inteiro
   de <style> e as duas telas já tinham começado a divergir. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
{% macro field_error(field) -%}
  {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors[0] }}</div>{% endif %}
{%- endmacro %}

<div class="auth-bg"></div>

<div class="auth-page">
  <div class="auth-card auth-card--solo">
    <div class="auth-main">
      <div class="auth-selo"><i class="bi bi-shield-lock"></i></div>
      <h2>Verificação em duas etapas</h2>
      <p class="auth-hint">Digite o código do seu app autenticador.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ 'warning' if cat=='message' else cat }} d-flex align-items-center gap-2">
              <i class="bi bi-info-circle"></i><span>{{ msg }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" novalidate class="d-grid gap-3">
        {{ form.hidden_tag() }}

        <div>
          {{ form.code.label(class="form-label") }}
          <div class="fld">
            {{ form.code(
                class="form-control code-input" + (" is-invalid" if form.code.errors else ""),
                placeholder="000000", inputmode="numeric", autocomplete="one-time-code",
                maxlength="6", autofocus=True
            ) }}
          </div>
          {{ field_error(form.code) }}
        </div>

        <button class="auth-btn" type="submit">
          <i class="bi bi-check2-circle"></i><span>Verificar e entrar</span>
        </button>
        <a href="{{ url_for('auth.login_cancel') }}" class="auth-link">Cancelar e voltar</a>
      </form>

      <div class="auth-foot">
        <i class="bi bi-shield-lock"></i> Acesso restrito · Refrigerantes Jaboti
      </div>
    </div>
  </div>
</div>
{% endblock %}
